# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: cd_main_nuget_dotnet-icons
on:
  workflow_dispatch


# Add permissions here to apply to all jobs in the workflow
permissions:
  id-token: write # Required for GitHub OIDC authentication
  contents: read  # Required for checkout actions (actions/checkout)

jobs:
  build_pack_publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x

    # build the package
    - name: Build
      run: dotnet build --configuration release
    - name: Test
      run: dotnet test --no-build --configuration release --verbosity normal
    - name: Pack
      run: dotnet pack --configuration release --property:PublicRelease=true

    # get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }} # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address

    # push the package
    - name: Publish package to Nuget.org
      run: dotnet nuget push ./artifacts/package/release/dotnet-icons*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
